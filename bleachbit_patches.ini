; BleachBit-specific additions to Winapp2-BleachBit.ini
; Applied by apply_bleachbit_patches.py during merge-commit.sh

[Windows Taskbar *]
Warning = This deletes Jump List entries (Recent Documents) in the taskbar.

; Section names may contain glob metacharacters (* ? [) to apply one entry
; to many sections. Upstream ships one "Saved Usernames & Passwords *"
; section per browser (Chromium-based, Firefox, Thunderbird, etc.), each
; deleting the browser's password store. One glob entry covers all of them
; and any future browsers upstream adds.
[* Saved Usernames & Passwords *]
Warning = This will delete all saved passwords for this browser.
